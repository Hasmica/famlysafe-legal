<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Famly Safe</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FAFAFA;
    --card: #ffffff;
    --text: #0B0B0C;
    --text-secondary: #6B6B70;
    --accent: #0B0B0C;
    --border: #E4E4E6;
    --error: #B00020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 28px;
    text-align: center;
  }
  .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 20px;
    background: #0B0B0C;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check.error { background: var(--error); }
  .check svg { width: 28px; height: 28px; }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 10px;
    letter-spacing: -0.3px;
  }
  p {
    color: var(--text-secondary);
    font-size: 1rem;
    margin: 0;
  }
  .card {
    margin-top: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    text-align: left;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    min-height: 48px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    color: var(--text);
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    min-height: 48px;
    border: none;
    border-radius: 24px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .field-error {
    color: var(--error);
    font-size: 0.85rem;
    margin: -10px 0 14px;
    display: none;
  }
  strong { color: var(--text); }
</style>
</head>
<body>
<main>
  <div id="icon" class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V7a5 5 0 00-5-5zm-3 8V7a3 3 0 016 0v3H9z" />
    </svg>
  </div>
  <h1 id="title">Set a new password</h1>
  <p id="message">Choose a new password for your Famly Safe account.</p>

  <div class="card" id="form-card">
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="6" required />
      <div class="field-error" id="field-error">Passwords don't match.</div>
      <button id="submit-btn" type="submit">Update password</button>
    </form>
  </div>

  <div class="card" id="done-card" style="display:none; text-align:center;">
    You can close this page now. Go back to <strong>Famly Safe</strong> and sign in with your new password.
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  var SUPABASE_URL = "https://mwoqzrixvzssifrcvsyr.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_cUSur6CekVUz1E4nu3b98g_cnfXxDhs";
  var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var icon = document.getElementById("icon");
  var title = document.getElementById("title");
  var message = document.getElementById("message");
  var formCard = document.getElementById("form-card");
  var doneCard = document.getElementById("done-card");
  var form = document.getElementById("reset-form");
  var submitBtn = document.getElementById("submit-btn");
  var fieldError = document.getElementById("field-error");

  function showExpired() {
    icon.classList.add("error");
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12" /></svg>';
    title.textContent = "This link has expired";
    message.textContent = "It's already been used or is too old to work.";
    formCard.innerHTML = 'Go back to <strong>Famly Safe</strong>, try signing in, and use "Forgot password?" again to get a new link.';
  }

  // Supabase's hosted recovery link lands here with either a session
  // already set (newer flow) or the tokens in the URL hash (#access_token=
  // ...&refresh_token=...&type=recovery) — or #error=...&error_code=... if
  // the link was already used or had expired. Same shape as confirmed.html's
  // error handling, plus the token exchange this page actually needs.
  var params = new URLSearchParams(location.hash.replace(/^#/, "") || location.search);

  if (params.get("error") || params.get("error_code")) {
    showExpired();
    return;
  }

  var accessToken = params.get("access_token");
  var refreshToken = params.get("refresh_token");

  function ready() {
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var password = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        fieldError.style.display = "block";
        return;
      }
      fieldError.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating…";
      var { error } = await client.auth.updateUser({ password: password });
      if (error) {
        fieldError.textContent = error.message;
        fieldError.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Update password";
        return;
      }
      formCard.style.display = "none";
      doneCard.style.display = "block";
      title.textContent = "Password updated";
      message.textContent = "You're all set.";
    });
  }

  if (accessToken && refreshToken) {
    client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken }).then(function (res) {
      if (res.error) {
        showExpired();
      } else {
        ready();
      }
    });
  } else {
    // Newer Supabase projects exchange the recovery code for a session
    // automatically before redirecting here (detectSessionInUrl) — check
    // for an existing session as a fallback instead of assuming failure.
    client.auth.getSession().then(function (res) {
      if (res.data.session) {
        ready();
      } else {
        showExpired();
      }
    });
  }
})();
</script>
</body>
</html>
